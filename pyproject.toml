[build-system]
requires = [ "setuptools" ]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["nix"] } }


[project]
name = "py-common-pkgs"
version = "0.0.0"

requires-python = "~= 3.11"

dependencies = [
    "matplotlib",
    "pyyaml",

    "uncertainties",
    "statsmodels",
    "scikit-learn",

    "numpy==1.26.4",  # newer versions don't work well w/ xgboost 1.5
    "xgboost==1.5.2",

    "mplhep",
    "uhi",
    "boost-histogram",
    "uproot",

    "zfit~=0.25",
    "tf-keras",

    # FIXME: dm-tree wheel problem: https://github.com/google-deepmind/tree/issues/129
    # we can manually remove the incompatible wheel

    "mkdocs",
]
